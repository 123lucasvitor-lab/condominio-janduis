<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d6e">
<link rel="manifest" href="manifest.json">
<title>Condomínio Janduis</title>
<style>
:root{--blue:#0b3d6e;--blue2:#1167b1;--bg:#f4f7fb;--text:#17324d;--muted:#718096;--green:#198754;--red:#dc3545;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:80px}
header{background:linear-gradient(145deg,var(--blue),#0d5b9d);color:#fff;padding:26px 20px 22px;border-radius:0 0 24px 24px}
.logo{font-weight:800;font-size:22px;letter-spacing:.2px}.sub{opacity:.85;font-size:13px;margin-top:4px}
h1{font-size:24px;margin:18px 0 4px}h2{font-size:18px;margin:0 0 12px}
.screen{padding:18px 16px}.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 3px 12px #16324d12}
.tile{min-height:112px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.icon{font-size:26px}.tile b{font-size:14px}.tile span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}.item{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px #16324d0c}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:12px;color:var(--muted)}.money{font-weight:800;font-size:18px}.pill{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#e9f7ef;color:var(--green)}.pill.red{background:#fdebec;color:var(--red)}
button{border:0;border-radius:12px;padding:12px 14px;background:var(--blue2);color:white;font-weight:700;font-size:14px;cursor:pointer}.secondary{background:#e8f0f8;color:var(--blue)}.full{width:100%}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fff;border-top:1px solid #e3eaf1;display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{background:transparent;color:var(--muted);padding:5px 8px;font-size:11px}nav button.active{color:var(--blue)}
.back{background:transparent;color:var(--blue);padding:0 0 14px;font-size:13px}.notice{border-left:4px solid var(--blue2)}.balance{font-size:28px;font-weight:850;color:var(--blue)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(160deg,#0b3d6e,#eef5fb)}
.loginbox{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:28px;box-shadow:0 15px 50px #0003}.brand{text-align:center;margin-bottom:25px}.building{font-size:50px}.login input{width:100%;padding:14px;margin:7px 0;border:1px solid #d8e0e8;border-radius:12px;font-size:15px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:14px;background:#fff}.stat strong{font-size:20px;display:block;margin-top:5px}
.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section{margin-top:22px}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginbox">
    <div class="brand"><div class="building">🏢</div><div class="logo" style="color:#0b3d6e">Condomínio Residencial Janduis</div><div class="sub">Versão 1.1 • Protótipo</div></div>
    <input id="user" placeholder="Apartamento (ex.: 101)">
    <input id="pass" type="password" placeholder="Senha">
    <button class="full" onclick="entrar()">Entrar</button>
    <button class="full secondary" style="margin-top:9px" onclick="demo()">Entrar no modo demonstração</button>
    <p class="small" style="text-align:center;margin-top:16px">Protótipo. Use o número do apartamento e a senha provisória 1234.</p>
  </div>
</div>

<div id="app" class="app hidden">
<header>
  <div class="logo">🏢 Condomínio Residencial Janduis</div>
  <div class="sub" id="roleLabel">Área do Morador</div>
  <h1 id="welcome">Olá!</h1>
  <div class="sub">Tudo do condomínio na palma da mão.</div>
</header>

<main id="content" class="screen"></main>

<nav>
  <button onclick="home()">🏠<br>Início</button>
  <button onclick="show('financeiro')">💰<br>Financeiro</button>
  <button onclick="show('reservas')">📅<br>Reservas</button>
  <button onclick="show('documentos')">📄<br>Documentos</button>
  <button onclick="show('mais')">☰<br>Mais</button>
</nav>
</div>

<script>
let role="morador", userName="Morador", apartment="";

// Protótipo: não armazena CPFs no código público.
// Login provisório: número do apartamento + senha 1234.
const moradores={
  "101":"Lucas Vitor",
  "102":"Rosely Alvarenga",
  "201":"Paulo Sérgio",
  "202":"Paulo Borges",
  "301":"Gabriel Rodrigues",
  "302":"Marisa Eugenio",
  "401":"Delduque Caetano",
  "402":"Lucilene de Fátima"
};

const data={
comunicados:[
["Manutenção do elevador","Hoje, 10h30 • Serviço de manutenção preventiva.","Importante"],
["Reunião do Conselho","Será realizada reunião do conselho administrativo.","Geral"],
["Festa do condomínio","Convite para a festa junina do condomínio.","Geral"],
["Aviso de encomenda","Você tem uma encomenda aguardando retirada.","Aviso"]
],
docs:["Convenção do Condomínio","Regimento Interno","Prestação de Contas 2025","Balancete Setembro/2026"],
reservas:["Salão de festas","Churrasqueira"],
};

function entrar(){
  const u=document.getElementById('user').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value.trim();
  if((u==="sindico"||u==="síndico") && pass==="1234"){
    apartment=""; userName="Lucas"; role="sindico"; openApp(); return;
  }
  const apt=u.replace(/[^0-9]/g,"");
  if(moradores[apt] && pass==="1234"){
    apartment=apt; userName=moradores[apt]; role="morador"; openApp(); return;
  }
  alert("Login inválido. Use o número do apartamento e a senha provisória 1234.");
}
function demo(){apartment="101";userName=moradores["101"];role="morador";openApp()}
function openApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');home()}
function home(){
document.getElementById('roleLabel').textContent=role==="sindico"?"Painel do Síndico":"Área do Morador";
document.getElementById('welcome').textContent=role==="sindico"?"Olá, Lucas!":"Olá, "+userName+"!";
if(role==="sindico") renderSindico(); else renderMorador();
}
function renderMorador(){
content.innerHTML=`<div class="grid">
<div class="card tile" onclick="show('comunicados')"><div class="icon">📢</div><b>Comunicados</b><span>Veja os avisos do condomínio</span></div>
<div class="card tile" onclick="show('financeiro')"><div class="icon">💰</div><b>Taxas e pagamentos</b><span>Boletos e histórico</span></div>
<div class="card tile" onclick="show('reservas')"><div class="icon">📅</div><b>Reservas</b><span>Áreas comuns</span></div>
<div class="card tile" onclick="show('solicitacoes')"><div class="icon">🛠️</div><b>Solicitações</b><span>Fale com o síndico</span></div>
<div class="card tile" onclick="show('documentos')"><div class="icon">📄</div><b>Documentos</b><span>Convenção e regimento</span></div>
<div class="card tile" onclick="show('enquetes')"><div class="icon">🗳️</div><b>Enquetes</b><span>Participe das decisões</span></div>
</div>
<div class="section"><h2>Últimos avisos</h2><div class="list">${data.comunicados.slice(0,3).map(x=>`<div class="item notice"><div class="row"><b>${x[0]}</b><span class="pill">${x[2]}</span></div><div class="small" style="margin-top:6px">${x[1]}</div></div>`).join("")}</div></div>`;
}
function renderSindico(){
content.innerHTML=`<div class="statgrid">
<div class="stat">Moradores<strong>8</strong></div><div class="stat">Inadimplentes<strong style="color:#dc3545">2</strong></div>
<div class="stat">Receitas<strong>R$ 4.080</strong></div><div class="stat">Despesas<strong>R$ 2.220</strong></div>
</div>
<div class="section"><h2>Administração</h2><div class="grid">
<div class="card tile" onclick="show('moradores')"><div class="icon">👥</div><b>Moradores</b><span>Cadastros e apartamentos</span></div>
<div class="card tile" onclick="show('financeiro')"><div class="icon">📊</div><b>Financeiro</b><span>Receitas, despesas e saldo</span></div>
<div class="card tile" onclick="show('comunicados')"><div class="icon">📢</div><b>Comunicados</b><span>Publicar avisos</span></div>
<div class="card tile" onclick="show('inadimplencia')"><div class="icon">⚠️</div><b>Inadimplência</b><span>Acompanhar pendências</span></div>
<div class="card tile" onclick="show('reservas')"><div class="icon">📅</div><b>Reservas</b><span>Administrar áreas</span></div>
<div class="card tile" onclick="show('prestacao')"><div class="icon">📑</div><b>Prestação de contas</b><span>Publicar balancetes</span></div>
</div></div>`;
}
function show(page){
let title="",body="";
if(page==="comunicados"){title="Comunicados";body=`<div class="list">${data.comunicados.map(x=>`<div class="item notice"><div class="row"><b>${x[0]}</b><span class="pill">${x[2]}</span></div><p class="small">${x[1]}</p></div>`).join("")}</div>${role==="sindico"?'<button class="full" style="margin-top:12px" onclick="alert(\'Na próxima etapa: formulário para publicar comunicado.\')">+ Novo comunicado</button>':''}`}
else if(page==="financeiro"){title="Financeiro";body=`<div class="card"><div class="small">Saldo atual</div><div class="balance">R$ 1.860,00</div><div class="small">Receitas R$ 4.080,00 • Despesas R$ 2.220,00</div></div><div class="section list"><div class="item"><div class="row"><b>Taxa condominial — Setembro/2026</b><span class="pill">Em aberto</span></div><div class="money">R$ 450,00</div><button class="secondary" onclick="alert('Na próxima etapa: emissão/visualização do boleto.')">Ver 2ª via</button></div><div class="item"><b>Histórico de pagamentos</b><p class="small">Agosto/2026 — R$ 450,00 — Pago</p><p class="small">Julho/2026 — R$ 450,00 — Pago</p></div></div>`}
else if(page==="reservas"){title="Reservas";body=`<div class="list">${data.reservas.map(x=>`<div class="item"><div class="row"><b>${x}</b><span class="pill">Disponível</span></div><p class="small">Escolha a data e o horário desejado.</p><button onclick="alert('Na próxima etapa: calendário e confirmação da reserva.')">Reservar</button></div>`).join("")}</div>`}
else if(page==="documentos"){title="Documentos";body=`<div class="list">${data.docs.map(x=>`<div class="item"><div class="row"><b>📄 ${x}</b><span class="small">PDF</span></div></div>`).join("")}</div>`}
else if(page==="solicitacoes"){title="Solicitações";body=`<button class="full" onclick="alert('Na próxima etapa: formulário da solicitação.')">+ Nova solicitação</button><div class="section list"><div class="item"><div class="row"><b>Manutenção</b><span class="pill">Em andamento</span></div><div class="small">Solicitação sobre vazamento.</div></div><div class="item"><div class="row"><b>Limpeza</b><span class="pill">Aberta</span></div></div></div>`}
else if(page==="enquetes"){title="Enquetes";body=`<div class="item"><b>Você é a favor da instalação de câmeras de segurança?</b><p class="small">Participe da decisão do condomínio.</p><button onclick="alert('Voto registrado no protótipo.')">Sim</button> <button class="secondary" onclick="alert('Voto registrado no protótipo.')">Não</button></div>`}
else if(page==="moradores"){title="Moradores";body=`<div class="list">${Object.entries(moradores).map(([apt,nome])=>`<div class="item"><div class="row"><b>Apto ${apt}</b><span class="pill">Ativo</span></div><div style="margin-top:5px">${nome}</div><div class="small">Login: apartamento ${apt} • senha provisória 1234</div></div>`).join("")}</div>`}
else if(page==="inadimplencia"){title="Inadimplência";body=`<div class="list"><div class="item"><div class="row"><b>Apto 102</b><span class="pill red">2 meses</span></div><div class="money">R$ 900,00</div><button onclick="alert('Na próxima etapa: mensagem de cobrança.')">Enviar cobrança</button></div><div class="item"><div class="row"><b>Apto 201</b><span class="pill red">1 mês</span></div><div class="money">R$ 450,00</div></div></div>`}
else if(page==="prestacao"){title="Prestação de contas";body=`<div class="item"><div class="row"><b>Setembro/2026</b><span class="pill">Publicado</span></div><p class="small">Receitas: R$ 4.080,00<br>Despesas: R$ 2.220,00<br>Saldo: R$ 1.860,00</p><button onclick="alert('Na próxima etapa: relatório completo em PDF.')">Ver relatório</button></div>`}
else {title="Mais";body=`<div class="list"><div class="item">⚙️ Configurações</div><div class="item">🔔 Preferências de notificações</div><div class="item">ℹ️ Sobre o aplicativo</div><div class="item"><button class="secondary" onclick="location.reload()">Sair</button></div></div>`}
content.innerHTML=`<button class="back" onclick="home()">← Voltar</button><div class="topline"><h2>${title}</h2></div>${body}`;
}
</script>
</body></html>
